<div class="admin-dashboard-container">
  <!-- Greeting Header -->
  <div class="dashboard-header" *ngIf="auth.currentUser() as user">
    <h2 class="dashboard-title">{{ dateTime.translations().adminPanel }}</h2>
    <p class="dashboard-welcome">
      {{ dateTime.translations().welcome }}, {{ user.firstName }} {{ user.lastName }} <span>&bull;</span> {{ dateTime.translations().fboId }}: {{ user.fboId }} <span>&bull;</span> {{ dateTime.translations().timezone }}: {{ user.timezone }}
    </p>
  </div>

  <!-- Administration Grid Panels -->
  <div class="dashboard-grid">
    <aviate-release-manager class="grid-item"></aviate-release-manager>
    <aviate-config-panel class="grid-item"></aviate-config-panel>
    <aviate-status-tracker class="grid-item span-two"></aviate-status-tracker>
  </div>
</div>
